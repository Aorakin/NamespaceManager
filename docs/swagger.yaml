  /ns/quotaUsage/{quota_id}/{ns_id}:
    get:
      description: Retrieve quota usage statistics for a specific quota in a namespace
      parameters:
      - description: Quota ID
        in: path
        name: quota_id
        required: true
        type: string
      - description: Namespace ID
        in: path
        name: ns_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Quota usage data
          schema:
            additionalProperties:
              $ref: '#/definitions/dtos.UsageDTO'
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get quota usage by namespace ID
      tags:
      - namespaces
  /ns/resource/{resource_id}:
    get:
      description: Retrieve details of a specific resource by ID
      parameters:
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resource details
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
