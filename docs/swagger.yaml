      - namespaces
  /ticket:
    get:
      description: Retrieve all tickets owned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.UserTicketResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get current user tickets
      tags:
      - tickets
    post:
      consumes:
      - application/json
      description: Request a new ticket from clearing house
      parameters:
      - description: Ticket request payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dtos.RequestTicketDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created ticket
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request ticket
      tags:
      - tickets
  /ticket/{ticket_id}/cancel:
    patch:
      description: Cancel a ticket by ticket ID
      parameters:
      - description: Ticket ID
        in: path
        name: ticket_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ticket cancelled
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Cancel ticket
      tags:
      - tickets
  /ticket/cancelTicket/{ticket_id}:
    get:
      description: Cancel a ticket by ticket ID
      parameters:
      - description: Ticket ID
        in: path
        name: ticket_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ticket cancelled
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Cancel ticket
      tags:
      - tickets
  /ticket/delete:
    patch:
      consumes:
      - application/json
      description: Soft-delete selected tickets by IDs
      parameters:
      - description: Ticket IDs
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dtos.DeleteTicketsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tickets deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
