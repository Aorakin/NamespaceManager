        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get project usage
      tags:
      - namespaces
  /ns/projects:
    get:
      description: Retrieve a list of all projects from the clearing house
      produces:
      - application/json
      responses:
        "200":
          description: List of projects
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/dtos.ProjectDTO'
              type: array
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get all projects
      tags:
      - namespaces
  /ns/projects/{project_id}:
    get:
      description: Retrieve details of a specific project by ID
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project details
          schema:
            additionalProperties:
              $ref: '#/definitions/dtos.ProjectDTO'
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get project detail
      tags:
      - namespaces
  /ns/quota/{ns_id}:
    get:
      description: Retrieve quota information for a specific namespace
      parameters:
      - description: Namespace ID
        in: path
        name: ns_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Quota data (JSON from clearing house)
          schema:
            type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get quota by namespace ID
