basePath: /
definitions:
  dtos.CreateTaskRequest:
    properties:
      tickets:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  dtos.CreateTicket:
    properties:
      glidelet_urn:
        type: string
      lease:
        type: string
      namespace_id:
        type: string
      namespace_urn:
        type: string
      redeem_timeout:
        type: string
      reference_ticket_id:
        type: string
      signature:
        type: string
      spec:
        items:
          $ref: '#/definitions/dtos.SpecListReq'
        type: array
    required:
    - glidelet_urn
    - lease
    - namespace_id
    - namespace_urn
    - redeem_timeout
    - signature
    - spec
    type: object
  dtos.DeleteTasksRequest:
    properties:
      task_ids:
        items:
          type: string
        type: array
    required:
    - task_ids
    type: object
  dtos.DeleteTicketsRequest:
    properties:
      ticket_ids:
        items:
          type: string
        type: array
    required:
    - ticket_ids
    type: object
  dtos.NamespaceDTO:
    properties:
      credit:
        type: number
      description:
        type: string
      id:
        type: string
      name:
        type: string
      namespace_members:
        items:
          $ref: '#/definitions/dtos.NamespaceMembers'
        type: array
      project_id:
        type: string
      quotas:
        type: string
    type: object
  dtos.NamespaceMembers:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  dtos.PodStatus:
    properties:
      errorMsg:
        type: string
      podId:
        type: string
      status:
        type: string
    type: object
  dtos.ProjectDTO:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
    type: object
  dtos.RegisterInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 2
        type: string
    required:
    - email
    - password
    - username
    type: object
  dtos.RequestTicketDTO:
    properties:
      duration:
        description: in seconds
        minimum: 1
        type: integer
      name:
        type: string
      namespace_id:
        type: string
      quota_id:
        type: string
      resources:
        items:
          $ref: '#/definitions/internal_ticket_dtos.ResourceDTO'
        type: array
    required:
    - duration
    - name
    - namespace_id
    - quota_id
    - resources
    type: object
  dtos.ResourcesPoolDetailDTO:
    properties:
      display_name:
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
    type: object
  dtos.SpecListReq:
    properties:
      pool_id:
        type: string
      resource:
        items:
          $ref: '#/definitions/dtos.SpecResourceReq'
        type: array
      type:
        $ref: '#/definitions/models.ResourceUnitType'
    required:
    - pool_id
    - resource
    - type
    type: object
  dtos.SpecResourceReq:
    properties:
      name:
        type: string
      quantity:
        type: integer
      unit:
        type: string
    required:
    - name
    - quantity
    - unit
    type: object
  dtos.StatusRes:
    properties:
      codeServerUrl:
        type: string
      hasError:
        type: boolean
      password:
        type: string
      status:
        items:
          $ref: '#/definitions/dtos.PodStatus'
        type: array
      ticketId:
        type: string
    type: object
  dtos.UsageDTO:
    properties:
      usage:
        items:
          $ref: '#/definitions/dtos.UsageDetail'
        type: array
    type: object
  dtos.UsageDetail:
    properties:
      quota:
        type: integer
      type:
        type: string
      type_id:
        type: string
      usage:
        type: integer
    type: object
  dtos.UserTicketResponse:
    properties:
      id:
        type: string
      name:
        type: string
      owner_name:
        type: string
      status:
        type: string
      ticket:
        $ref: '#/definitions/models.GliderTicket'
    type: object
  internal_ticket_dtos.ResourceDTO:
    properties:
      quantity:
        minimum: 0
        type: integer
      resource_id:
        type: string
    required:
    - quantity
    - resource_id
    type: object
  models.GliderSpec:
    properties:
      pool_id:
        type: string
      resource:
        items:
          $ref: '#/definitions/models.SpecResource'
        type: array
      type:
        $ref: '#/definitions/models.ResourceUnitType'
    type: object
  models.GliderTicket:
    properties:
      created_at:
        type: string
      glidelet_name:
        type: string
      glidelet_urn:
        description: resource_pool.URN (where to send request)
        type: string
      id:
        description: ticket id
        type: string
      lease:
        description: in seconds
        type: integer
      namespace_id:
        description: namespace id
        type: string
      namespace_name:
        type: string
      node_display_name:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      organization_name:
        type: string
      project_id:
        description: project id
        type: string
      project_name:
        type: string
      redeem_timeout:
        description: in seconds
        type: integer
      reference_ticket_id:
        type: string
      resource_pool_id:
        type: string
      resource_pool_name:
        type: string
      spec:
        $ref: '#/definitions/models.GliderSpec'
    type: object
  models.ResourceUnitType:
    enum:
    - compute
    - compute
    - storage
    - network
    - service
    type: string
    x-enum-varnames:
    - ResourceUnitTypeCPU
    - ResourceUnitCompute
    - ResourceUnitStorage
    - ResourceUnitNetwork
    - ResourceUnitService
  models.SpecResource:
    properties:
      name:
        type: string
      quantity:
        type: integer
      resource_id:
        type: string
      unit:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Resource Allocation and Management in Multi-Cluster project
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: NamespaceManager API
  version: "1.0"
paths:
  /ns/namespaceUsage/{ns_id}:
    get:
      description: Retrieve usage statistics for a specific namespace
      parameters:
      - description: Namespace ID
        in: path
        name: ns_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Namespace usage data
          schema:
            additionalProperties:
              $ref: '#/definitions/dtos.UsageDTO'
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get namespace usage
      tags:
      - namespaces
  /ns/namespaces/{ns_id}:
    get:
      description: Retrieve details of a specific namespace by ID
      parameters:
      - description: Namespace ID
        in: path
        name: ns_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Namespace details
          schema:
            additionalProperties:
              $ref: '#/definitions/dtos.NamespaceDTO'
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get namespace detail
      tags:
      - namespaces
  /ns/namespaces/all/{project_id}:
    get:
      description: Retrieve all namespaces belonging to a specific project
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of namespaces
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/dtos.NamespaceDTO'
              type: array
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get namespaces by project ID
      tags:
      - namespaces
  /ns/pool/{pool_id}:
    get:
      description: Retrieve resource pool details by pool ID
      parameters:
      - description: Pool ID
        in: path
        name: pool_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resource pool details
          schema:
            additionalProperties:
              $ref: '#/definitions/dtos.ResourcesPoolDetailDTO'
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
