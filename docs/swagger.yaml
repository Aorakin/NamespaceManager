  /ticket/tasks:
    get:
      description: Retrieve all tasks for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Tasks list
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
